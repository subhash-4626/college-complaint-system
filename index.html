    function showToast(message, type = 'success') {
      const toast = document.getElementById('toastNotification');
      const msg = document.getElementById('toastMessage');
      const icon = document.getElementById('toastIcon');

      msg.innerText = message;
      if (type === 'success') {
        toast.className = 'fixed bottom-5 right-5 z-50 transform translate-y-0 opacity-100 transition-all duration-300 glass-card px-5 py-3 rounded-xl border border-emerald-500/50 text-emerald-300 flex items-center space-x-3 shadow-2xl';
        icon.className = 'fa-solid fa-circle-check text-emerald-400 text-xl';
      } else if (type === 'error') {
        toast.className = 'fixed bottom-5 right-5 z-50 transform translate-y-0 opacity-100 transition-all duration-300 glass-card px-5 py-3 rounded-xl border border-rose-500/50 text-rose-300 flex items-center space-x-3 shadow-2xl';
        icon.className = 'fa-solid fa-circle-exclamation text-rose-400 text-xl';
      } else {
        toast.className = 'fixed bottom-5 right-5 z-50 transform translate-y-0 opacity-100 transition-all duration-300 glass-card px-5 py-3 rounded-xl border border-amber-500/50 text-amber-300 flex items-center space-x-3 shadow-2xl';
        icon.className = 'fa-solid fa-circle-info text-amber-400 text-xl';
      }

      setTimeout(() => {
        toast.classList.add('translate-y-24', 'opacity-0');
      }, 3500);
    }

    function onStudentIdInput(val) {
      val = val.trim().toUpperCase();
      const nameInput = document.getElementById('regFullName');
      const emailInput = document.getElementById('regEmail');
      const hint = document.getElementById('regLookupHint');

      if (STUDENT_ROSTER[val]) {
        nameInput.value = STUDENT_ROSTER[val];
        emailInput.value = val.toLowerCase() + '@vignan.ac.in';
        hint.innerHTML = `<span class="text-emerald-400"><i class="fa-solid fa-check"></i> Found in IT Batch: <b>${STUDENT_ROSTER[val]}</b></span>`;
      } else {
        hint.innerHTML = `💡 Enter ID (e.g. 241FA07001) to auto-fill from roster.`;
      }
    }

    function handleRegistration(e) {
      e.preventDefault();
      const id = document.getElementById('regStudentId').value.trim().toUpperCase();
      const name = document.getElementById('regFullName').value.trim();
      const dept = document.getElementById('regDept').value;
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const mobile = document.getElementById('regMobile').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;

      if (password !== confirmPassword) {
        showToast('Passwords do not match!', 'error');
        return;
      }

      const users = JSON.parse(localStorage.getItem('ccms_users')) || [];
      const existing = users.find(u => u.id === id || u.email === email);

      if (existing) {
        showToast('Registration Number or Email already registered!', 'error');
        return;
      }

      const newUser = {
        id: id,
        name: name,
        role: 'Student',
        dept: dept,
        course: 'B.Tech',
        branch: 'IT',
        year: document.getElementById('regYear').value,
        section: document.getElementById('regSection').value,
        email: email,
        mobile: mobile,
        password: password
      };

      users.push(newUser);
      localStorage.setItem('ccms_users', JSON.stringify(users));

      showToast('Registration successful! Please login.', 'success');
      showLoginModal(id);
    }

    function quickFill(id, pass, role) {
      document.getElementById('loginId').value = id;
      document.getElementById('loginPassword').value = pass;
      document.getElementById('loginRole').value = role;
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('loginId').value.trim();
      const pass = document.getElementById('loginPassword').value;
      const role = document.getElementById('loginRole').value;

      const users = JSON.parse(localStorage.getItem('ccms_users')) || [];
      const user = users.find(u => 
        (u.id.toLowerCase() === id.toLowerCase() || (u.email && u.email.toLowerCase() === id.toLowerCase())) &&
        u.password === pass &&
        u.role === role
      );

      if (!user) {
        showToast('Invalid email, ID or password.', 'error');
        return;
      }

      currentUser = user;
      sessionStorage.setItem('ccms_current_user', JSON.stringify(user));
      closeModal();
      renderNav();
      showToast(`Welcome back, ${user.name}!`, 'success');
      showDashboardHome();
    }

    function logout() {
      currentUser = null;
      sessionStorage.removeItem('ccms_current_user');
      renderNav();
      showToast('You have been logged out.', 'info');
      renderAuthHero();
    }

    function renderComplaintsRows(complaintsList, role) {
      if (!complaintsList.length) return '';
      return complaintsList.map(c => {
        let badgeColor = 'bg-slate-700 text-slate-300';
        if (c.status === 'Submitted') badgeColor = 'bg-amber-900/60 text-amber-300 border border-amber-500/40';
        else if (c.status === 'Assigned') badgeColor = 'bg-blue-900/60 text-blue-300 border border-blue-500/40';
        else if (c.status === 'In Progress') badgeColor = 'bg-indigo-900/60 text-indigo-300 border border-indigo-500/40';
        else if (c.status === 'Resolved') badgeColor = 'bg-emerald-900/60 text-emerald-300 border border-emerald-500/40';
        else if (c.status === 'Closed') badgeColor = 'bg-teal-900/60 text-teal-300 border border-teal-500/40';
        else if (c.status === 'Rejected') badgeColor = 'bg-rose-900/60 text-rose-300 border border-rose-500/40';

        let prioColor = 'text-slate-300';
        if (c.priority === 'Urgent') prioColor = 'text-rose-400 font-bold';
        else if (c.priority === 'High') prioColor = 'text-orange-400 font-semibold';

        return `
          <tr class="hover:bg-slate-800/40 transition">
            <td class="py-3 px-3 font-mono font-medium text-amber-400">${c.id}</td>
            <td class="py-3 px-3 text-slate-400">${c.date}</td>
            <td class="py-3 px-3"><span class="px-2 py-0.5 rounded bg-slate-800 text-slate-300">${c.category}</span></td>
            <td class="py-3 px-3 max-w-xs truncate font-medium text-slate-200" title="${c.title}">${c.title}</td>
            <td class="py-3 px-3 ${prioColor}">${c.priority}</td>
            <td class="py-3 px-3"><span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold ${badgeColor}">${c.status}</span></td>
            <td class="py-3 px-3">
              <div class="flex items-center space-x-1.5">
                <button onclick="viewComplaintDetails('${c.id}')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-amber-300 rounded border border-slate-700">
                  <i class="fa-solid fa-eye"></i> View
                </button>
                ${role === 'staff' ? `
                  <button onclick="showStaffActionModal('${c.id}')" class="px-2 py-1 bg-blue-900/40 hover:bg-blue-800 text-blue-300 rounded border border-blue-500/40">
                    <i class="fa-solid fa-pen-to-square"></i> Update
                  </button>
                ` : ''}
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

                <label class="block text-xs font-semibold text-slate-300 mb-1">Priority Level *</label>
                <select id="cmpPriority" required class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs focus:border-amber-400 focus:outline-none">
                  <option value="Low">Low (General maintenance)</option>
                  <option value="Medium" selected>Medium (Standard request)</option>
                  <option value="High">High (Impacting classwork)</option>
                  <option value="Urgent">Urgent (Immediate attention)</option>
                </select>
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Complaint Title *</label>
              <input type="text" id="cmpTitle" placeholder="Short clear summary of problem" required
                     class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs focus:border-amber-400 focus:outline-none">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Detailed Description *</label>
              <textarea id="cmpDesc" rows="4" placeholder="Provide full details of the issue..." required
                        class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs focus:border-amber-400 focus:outline-none"></textarea>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Attach Image / Proof (Optional)</label>
              <input type="file" id="cmpImage" accept="image/*"
                     class="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-slate-400 text-xs file:mr-3 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:bg-amber-500 file:text-black hover:file:bg-amber-400">
            </div>

            <button type="submit" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm shadow-xl transition mt-2">
              <i class="fa-solid fa-paper-plane mr-1.5"></i> Submit Complaint
            </button>

          </form>

        </div>
      `;
    }

    function handleNewComplaint(e, id) {
      e.preventDefault();
      const complaints = JSON.parse(localStorage.getItem('ccms_complaints')) || [];

      const now = new Date();
      const dateStr = now.toISOString().split('T')[0] + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const newCmp = {
        id: id,
        studentId: currentUser.id,
        studentName: currentUser.name,
        category: document.getElementById('cmpCategory').value,
        department: document.getElementById('cmpDept').value,
        location: document.getElementById('cmpLocation').value.trim(),
        priority: document.getElementById('cmpPriority').value,
        title: document.getElementById('cmpTitle').value.trim(),
        description: document.getElementById('cmpDesc').value.trim(),
        status: 'Submitted',
        assignedStaff: 'Unassigned',
        date: dateStr,
        timeline: [
          { status: 'Submitted', time: dateStr, remark: 'Complaint lodged by student.' }
        ],
        remarks: 'Complaint registered and queued for departmental assignment.',
        feedback: null
      };

      complaints.unshift(newCmp);
      localStorage.setItem('ccms_complaints', JSON.stringify(complaints));

      closeModal();
      showToast(`Complaint ${id} registered successfully!`, 'success');
      renderStudentDashboard();
    }

    /* ==========================================================================
       10. COMPLAINT DETAILS & TIMELINE
       ========================================================================== */
    function viewComplaintDetails(id) {
      const complaints = JSON.parse(localStorage.getItem('ccms_complaints')) || [];
      const c = complaints.find(item => item.id === id);
      if (!c) return;

      const modal = document.getElementById('modalOverlay');
      modal.classList.remove('hidden');

      const statuses = ['Submitted', 'Under Review', 'Assigned', 'In Progress', 'Resolved', 'Closed'];
      const currentIndex = statuses.indexOf(c.status);

      modal.innerHTML = `
        <div class="glass-card rounded-2xl border-2 border-amber-500/40 p-6 md:p-8 max-w-2xl w-full max-h-[92vh] overflow-y-auto shadow-2xl relative">
          
          <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
            <i class="fa-solid fa-xmark"></i>
          </button>

          <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
            <div>
              <span class="text-xs text-slate-400">Official Ticket</span>
              <h2 class="font-mono text-xl font-bold text-amber-400">${c.id}</h2>
            </div>
            <div class="text-right">
              <span class="px-3 py-1 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40">${c.status}</span>
            </div>
          </div>

          <div class="mb-6 p-4 rounded-xl bg-slate-900 border border-slate-800">
            <div class="text-xs font-semibold text-slate-400 mb-3">Redressal Progress:</div>
            <div class="flex items-center justify-between text-center relative">
              ${statuses.map((s, idx) => {
                const isPassed = idx <= currentIndex;
                const isCurrent = idx === currentIndex;
                return `
                  <div class="flex flex-col items-center flex-1">
                    <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${isCurrent ? 'bg-amber-400 text-slate-950 ring-4 ring-amber-400/30' : (isPassed ? 'bg-emerald-500 text-white' : 'bg-slate-800 text-slate-500')}">
                      ${isPassed ? '<i class="fa-solid fa-check"></i>' : (idx + 1)}
                    </div>
                    <span class="text-[10px] mt-1.5 font-medium ${isCurrent ? 'text-amber-400 font-bold' : (isPassed ? 'text-slate-300' : 'text-slate-500')} hidden sm:block">${s}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs mb-4">
            <div class="glass-card p-3 rounded-xl border border-slate-800">
              <span class="text-slate-400 block mb-1">Student Information:</span>
              <div class="font-semibold text-slate-200">${c.studentName}</div>
              <div class="text-amber-400 font-mono">${c.studentId}</div>
            </div>

            <div class="glass-card p-3 rounded-xl border border-slate-800">
              <span class="text-slate-400 block mb-1">Target Department:</span>
              <div class="font-semibold text-slate-200">${c.department}</div>
              <div class="text-slate-400">Assigned: <span class="text-blue-300">${c.assignedStaff}</span></div>
            </div>

            <div class="glass-card p-3 rounded-xl border border-slate-800">
              <span class="text-slate-400 block mb-1">Category & Priority:</span>
              <div class="font-semibold text-slate-200">${c.category}</div>
              <div class="text-amber-400 font-medium">Priority: ${c.priority}</div>
            </div>

            <div class="glass-card p-3 rounded-xl border border-slate-800">
              <span class="text-slate-400 block mb-1">Location & Date:</span>
              <div class="font-semibold text-slate-200">${c.location}</div>
              <div class="text-slate-400">${c.date}</div>
            </div>
          </div>

          <div class="glass-card p-4 rounded-xl border border-slate-800 text-xs mb-4">
            <span class="text-slate-400 block mb-1 font-semibold">Title:</span>
            <div class="text-slate-100 font-medium mb-3">${c.title}</div>
            <span class="text-slate-400 block mb-1 font-semibold">Description:</span>
            <div class="text-slate-300 leading-relaxed whitespace-pre-wrap">${c.description}</div>
          </div>

          <div class="glass-card p-4 rounded-xl border border-slate-800 text-xs mb-4">
            <span class="text-slate-400 block mb-1 font-semibold">Department Remarks / Resolution Proof:</span>
            <div class="text-emerald-300">${c.remarks || 'No remarks recorded yet.'}</div>
          </div>

          ${c.status === 'Resolved' && !c.feedback && currentUser && currentUser.role === 'Student' ? `
            <div class="glass-card p-4 rounded-xl border border-amber-500/40 text-xs">
              <span class="text-amber-400 font-bold block mb-2">Provide Feedback on Resolution:</span>
              <div class="flex items-center space-x-2 mb-3">
                <span>Rating:</span>
                <select id="fbRating" class="px-2 py-1 rounded bg-slate-900 border border-slate-700 text-amber-300 font-bold">
                  <option value="5">★★★★★ (Excellent)</option>
                  <option value="4">★★★★☆ (Good)</option>
                  <option value="3">★★★☆☆ (Average)</option>
                  <option value="2">★★☆☆☆ (Poor)</option>
                  <option value="1">★☆☆☆☆ (Unsatisfactory)</option>
                </select>
              </div>
              <textarea id="fbComment" rows="2" placeholder="Write feedback comments..." class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-xs mb-2"></textarea>
              <button onclick="submitStudentFeedback('${c.id}')" class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold">
                Submit Feedback
              </button>
            </div>
          ` : (c.feedback ? `
            <div class="glass-card p-3 rounded-xl border border-slate-800 text-xs text-amber-300">
              <i class="fa-solid fa-star mr-1"></i> Student Rating: ${c.feedback.rating}/5 - "${c.feedback.comment}"
            </div>
          ` : '')}

          <div class="mt-6 flex justify-end">
            <button onclick="closeModal()" class="px-5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold">
              Close
            </button>
          </div>

        </div>
      `;
    }

    function submitStudentFeedback(id) {
      const rating = document.getElementById('fbRating').value;
      const comment = document.getElementById('fbComment').value.trim();

      const complaints = JSON.parse(localStorage.getItem('ccms_complaints')) || [];
      const c = complaints.find(item => item.id === id);
      if (c) {
        c.feedback = { rating: parseInt(rating), comment: comment };
        c.status = 'Closed';
        c.timeline.push({
          status: 'Closed',
          time: new Date().toISOString().split('T')[0],
          remark: `Feedback submitted by student. Rating: ${rating}/5`
        });
        localStorage.setItem('ccms_complaints', JSON.stringify(complaints));
        showToast('Thank you for your feedback! Ticket closed.', 'success');
        closeModal();
        renderStudentDashboard();
      }
    }

    /* ==========================================================================
       11. STAFF DASHBOARD
       ========================================================================== */
    function renderStaffDashboard() {
      const complaints = JSON.parse(localStorage.getItem('ccms_complaints')) || [];
      const assigned = complaints.filter(c => c.department.includes('IT') || c.assignedStaff.includes(currentUser.name));

      const total = assigned.length;
      const pending = assigned.filter(c => c.status === 'Submitted' || c.status === 'Assigned').length;
      const inProg = assigned.filter(c => c.status === 'In Progress').length;
      const resolved = assigned.filter(c => c.status === 'Resolved' || c.status === 'Closed').length;

      const container = document.getElementById('appContainer');
      container.innerHTML = `
        <div class="space-y-6">
          <div class="glass-card rounded-2xl p-6 border-l-4 border-blue-400 flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
              <h2 class="font-classic text-xl font-bold text-slate-100">${currentUser.name}</h2>
              <p class="text-xs text-blue-300">Staff Portal • Department of Information Technology</p>
            </div>
            <div class="text-xs text-slate-300 bg-slate-900 px-4 py-2 rounded-xl border border-slate-800">
              <i class="fa-solid fa-clock mr-1 text-amber-400"></i> Active Grievances In Queue: <span class="font-bold text-white">${pending + inProg}</span>
            </div>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="glass-card p-4 rounded-xl border border-slate-700">
              <div class="text-xs text-slate-300">Total Department Tickets</div>
              <div class="text-2xl font-bold text-slate-100 mt-1">${total}</div>
            </div>
            <div class="glass-card p-4 rounded-xl border border-amber-500/40">
              <div class="text-xs text-amber-300">Action Required</div>
              <div class="text-2xl font-bold text-amber-400 mt-1">${pending}</div>
            </div>
            <div class="glass-card p-4 rounded-xl border border-blue-500/40">
              <div class="text-xs text-blue-300">In Progress</div>
              <div class="text-2xl font-bold text-blue-400 mt-1">${inProg}</div>
            </div>
            <div class="glass-card p-4 rounded-xl border border-emerald-500/40">
              <div class="text-xs text-emerald-300">Resolved</div>
              <div class="text-2xl font-bold text-emerald-400 mt-1">${resolved}</div>
            </div>
          </div>

          <div class="glass-card rounded-2xl border border-slate-700 p-5">
            <h3 class="font-classic text-lg font-bold text-amber-400 mb-4">Assigned Department Complaints</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs text-slate-300">
                <thead class="bg-slate-900 text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-800">
                  <tr>
                    <th class="py-3 px-3">Complaint ID</th>
                    <th class="py-3 px-3">Student</th>
                    <th class="py-3 px-3">Category</th>
                    <th class="py-3 px-3">Title</th>
                    <th class="py-3 px-3">Priority</th>
                    <th class="py-3 px-3">Status</th>
                    <th class="py-3 px-3">Action</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                  ${renderComplaintsRows(assigned, 'staff')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function showStaffActionModal(id) {
      const complaints = JSON.parse(localStorage.getItem('ccms_complaints')) || [];
      const c = complaints.find(item => item.id === id);
      if (!c) return;

      const modal = document.getElementById('modalOverlay');
      modal.classList.remove('hidden');

      modal.innerHTML = `
        <div class="glass-card rounded-2xl border-2 border-blue-500/40 p-6 max-w-lg w-full shadow-2xl relative">
          <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
            <i class="fa-solid fa-xmark"></i>
          </button>

          <h2 class="font-classic text-xl font-bold text-blue-400 mb-1">Update Ticket ${c.id}</h2>
          <p class="text-xs text-slate-400 mb-4">${c.title}</p>

          <form onsubmit="handleStaffUpdate(event, '${c.id}')" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Update Status *</label>
              <select id="staffNewStatus" required class="w-full p-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs">
                <option value="In Progress" ${c.status === 'In Progress' ? 'selected' : ''}>In Progress (Work ongoing)</option>
                <option value="Resolved" ${c.status === 'Resolved' ? 'selected' : ''}>Resolved (Issue fixed)</option>
                <option value="Rejected" ${c.status === 'Rejected' ? 'selected' : ''}>Reject / Invalid</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Staff Resolution Remark *</label>
              <textarea id="staffRemarks" rows="3" placeholder="Explain action taken..." required
                        class="w-full p-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white"></textarea>
            </div>

            <button type="submit" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-xl transition">
              Save Status & Notify Student
            </button>
          </form>
        </div>
      `;
    }

    function handleStaffUpdate(e, id) {
      e.preventDefault();
      const status = document.getElementById('staffNewStatus').value;
      const remarks = document.getElementById('staffRemarks').value.trim();

      const complaints = JSON.parse(localStorage.getItem('ccms_complaints')) || [];
      const c = complaints.find(item => item.id === id);
      if (c) {
        c.status = status;
        c.remarks = remarks;
        c.timeline.push({
          status: status,
          time: new Date().toISOString().split('T')[0] + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          remark: remarks
        });
        localStorage.setItem('ccms_complaints', JSON.stringify(complaints));
        showToast(`Complaint ${id} updated to ${status}!`, 'success');
        closeModal();
        renderStaffDashboard();
      }
    }

    /* ==========================================================================
       12. ADMIN DASHBOARD
       ========================================================================== */
    function renderAdminDashboard() {
      const complaints = JSON.parse(localStorage.getItem('ccms_complaints')) || [];
      const users = JSON.parse(localStorage.getItem('ccms_users')) || [];

      const totalStudents = users.filter(u => u.role === 'Student').length;
      const totalStaff = users.filter(u => u.role === 'Staff').length;
      const totalComplaints = complaints.length;
      const resolved = complaints.filter(c => c.status === 'Resolved' || c.status === 'Closed').length;

      const container = document.getElementById('appContainer');
      container.innerHTML = `
        <div class="space-y-6">
          <div class="glass-card rounded-2xl p-6 border-l-4 border-purple-500 flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
              <h2 class="font-classic text-xl font-bold text-purple-300">University Admin Console</h2>
              <p class="text-xs text-slate-300">Master Governance & Grievance Control | VFSTR</p>
            </div>
            <div class="flex items-center space-x-2">
              <button onclick="exportComplaintsCSV()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs font-semibold border border-slate-700">
                <i class="fa-solid fa-file-export mr-1"></i> Export Data (CSV)
              </button>
            </div>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="glass-card p-4 rounded-xl border border-slate-700">
              <div class="text-xs text-slate-300">Total Registered Students</div>
              <div class="text-2xl font-bold text-amber-400 mt-1">${totalStudents}</div>
            </div>
            <div class="glass-card p-4 rounded-xl border border-slate-700">
              <div class="text-xs text-slate-300">Total Department Staff</div>
              <div class="text-2xl font-bold text-blue-400 mt-1">${totalStaff}</div>
            </div>
            <div class="glass-card p-4 rounded-xl border border-slate-700">
              <div class="text-xs text-slate-300">All Grievances Lodged</div>
              <div class="text-2xl font-bold text-purple-400 mt-1">${totalComplaints}</div>
            </div>
            <div class="glass-card p-4 rounded-xl border border-emerald-500/40">
              <div class="text-xs text-emerald-300">Total Solved & Closed</div>
              <div class="text-2xl font-bold text-emerald-400 mt-1">${resolved}</div>
            </div>
          </div>

          <div class="glass-card rounded-2xl border border-slate-700 p-5">
            <h3 class="font-classic text-lg font-bold text-amber-400 mb-4">Master Complaints Ledger</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs text-slate-300">
                <thead class="bg-slate-900 text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-800">
                  <tr>
                    <th class="py-3 px-3">ID</th>
                    <th class="py-3 px-3">Student</th>
                    <th class="py-3 px-3">Department</th>
                    <th class="py-3 px-3">Category</th>
                    <th class="py-3 px-3">Priority</th>
                    <th class="py-3 px-3">Status</th>
                    <th class="py-3 px-3">Action</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                  ${complaints.map(c => `
                    <tr class="hover:bg-slate-800/40">
                      <td class="py-3 px-3 font-mono font-medium text-amber-400">${c.id}</td>
                      <td class="py-3 px-3 text-slate-200">${c.studentName} (${c.studentId})</td>
                      <td class="py-3 px-3 text-slate-300">${c.department}</td>
                      <td class="py-3 px-3">${c.category}</td>
                      <td class="py-3 px-3 font-semibold ${c.priority === 'Urgent' ? 'text-rose-400' : 'text-slate-300'}">${c.priority}</td>
                      <td class="py-3 px-3"><span class="px-2 py-0.5 rounded text-[10px] bg-slate-800 font-bold">${c.status}</span></td>
                      <td class="py-3 px-3">
                        <button onclick="viewComplaintDetails('${c.id}')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-amber-300 rounded border border-slate-700 text-xs">
                          Review
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function exportComplaintsCSV() {
      const complaints = JSON.parse(localStorage.getItem('ccms_complaints')) || [];
      if (!complaints.length) {
        showToast('No complaints to export.', 'info');
        return;
      }
      let csv = 'Complaint_ID,Student_ID,Student_Name,Department,Category,Priority,Status,Date\n';
      complaints.forEach(c => {
        csv += `"${c.id}","${c.studentId}","${c.studentName}","${c.department}","${c.category}","${c.priority}","${c.status}","${c.date}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `VFSTR_CCMS_Report_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      showToast('Grievance report exported successfully!', 'success');
    }

    /* ==========================================================================
       13. TRACK COMPLAINT MODAL (PUBLIC QUICK LOOKUP)
       ========================================================================== */
    function showTrackModal() {
      const modal = document.getElementById('modalOverlay');
      modal.classList.remove('hidden');

      modal.innerHTML = `
        <div class="glass-card rounded-2xl border-2 border-blue-500/40 p-6 max-w-md w-full shadow-2xl relative">
          <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
            <i class="fa-solid fa-xmark"></i>
          </button>
          
          <div class="text-center mb-5">
            <i class="fa-solid fa-satellite-dish text-3xl text-amber-400 mb-2"></i>
            <h2 class="font-classic text-xl font-bold text-amber-400">Track Complaint Status</h2>
            <p class="text-xs text-slate-300">Enter your Complaint ID to view live progress</p>
          </div>

          <div class="space-y-4">
            <div>
              <input type="text" id="trackInputId" placeholder="e.g. CMP-2026-0001" 
                     class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white font-mono uppercase text-sm focus:border-amber-400 focus:outline-none">
            </div>
            <button onclick="doTrackComplaint()" class="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs shadow-xl transition">
              <i class="fa-solid fa-magnifying-glass mr-1"></i> Check Status
            </button>
          </div>
        </div>
      `;
    }

    function doTrackComplaint() {
      const id = document.getElementById('trackInputId').value.trim().toUpperCase();
      const complaints = JSON.parse(localStorage.getItem('ccms_complaints')) || [];
      const found = complaints.find(c => c.id === id);

      if (!found) {
        showToast('Complaint ID not found. Please verify the ID.', 'error');
        return;
      }

      closeModal();
      viewComplaintDetails(found.id);
    }

    // Initialize Application
    renderNav();
    showDashboardHome();
  </script>
</body>
